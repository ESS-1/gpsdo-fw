<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal</title>
  <link rel="stylesheet" href="terminal.css">
  <script src="terminal.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Terminal</h1>
      <div class="subtitle">Send a command and watch the receiver stream</div>
    </div>
    <div class="toolbar">
      <label class="field-label" for="baudInput">Baud</label>
      <input id="baudInput" class="baud-input" type="number" min="1200" step="1200" value="115200">
      <button id="connectBtn" type="button">Connect</button>
      <button id="disconnectBtn" type="button" disabled>Disconnect</button>
    </div>
  </header>

  <main>
    <section class="status-strip">
      <div class="summary-item">
        <span class="summary-label">Port</span>
        <strong id="portStatus">Idle</strong>
      </div>
      <div class="summary-item">
        <span class="summary-label">Last TX</span>
        <strong id="txStatus" class="result neutral">None</strong>
      </div>
      <div class="summary-item">
        <span class="summary-label">Received lines</span>
        <strong id="lineCount">0</strong>
      </div>
      <div class="summary-item">
        <span class="summary-label">Command mode</span>
        <strong id="modeStatus">Payload</strong>
      </div>
    </section>

    <section class="command-panel">
      <div class="section-heading">
        <h2>Command</h2>
        <div class="button-row">
          <button id="loadHotStartBtn" type="button">Load hot start</button>
          <button id="clearLogBtn" type="button">Clear log</button>
        </div>
      </div>

      <div class="form-grid">
        <label class="field">
          <span>Command mode</span>
          <select id="commandMode">
            <option value="payload" selected>NMEA payload, auto checksum</option>
            <option value="raw">Raw command line</option>
          </select>
        </label>

        <label class="field wide">
          <span id="commandLabel">NMEA payload</span>
          <input id="commandInput" type="text" spellcheck="false" placeholder="Example: PCAS10,0">
        </label>
      </div>

      <div class="send-row">
        <button id="sendBtn" class="primary" type="button" disabled>Send command</button>
        <code id="previewText">$...*CS\r\n</code>
      </div>
    </section>

    <section class="log-panel">
      <div class="section-heading">
        <h2>Serial log</h2>
        <span class="muted">RX and TX are shown with timestamps</span>
      </div>
      <pre id="serialLog"></pre>
    </section>
  </main>
</body>
</html>
